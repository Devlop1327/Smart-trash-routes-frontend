<div class="standard-dashboard">
  <!-- Custom Header -->
  <header class="custom-header">
    <div class="header-content">
      <ion-menu-button menu="main-menu" class="menu-btn">
        <ion-icon name="menu-outline"></ion-icon>
      </ion-menu-button>
      <h1 class="header-title">Ayuda y Tips</h1>
      <div style="width: 44px;"></div>
    </div>
  </header>

  <div class="dashboard-content-scroll">
    <div class="ayuda-container">
      <div class="help-intro">
        <div class="icon-circle-large">
          <ion-icon name="help-circle-outline"></ion-icon>
        </div>
        <h2>¿En qué podemos ayudarte?</h2>
        <p>Encuentra respuestas rápidas para usar Smart Trash Routes como un experto.</p>
      </div>

      <div class="faq-list">
        <div *ngFor="let faq of faqs; let i = index" 
             class="faq-card" 
             [class.is-open]="faq.abierta"
             (click)="toggleFaq(i)">
          <div class="faq-header">
            <div class="faq-icon-box">
              <ion-icon [name]="faq.icon"></ion-icon>
            </div>
            <span class="faq-question">{{ faq.pregunta }}</span>
            <ion-icon [name]="faq.abierta ? 'chevron-up-outline' : 'chevron-down-outline'" class="arrow"></ion-icon>
          </div>
          <div class="faq-body" *ngIf="faq.abierta">
            <p>{{ faq.respuesta }}</p>
          </div>
        </div>
      </div>

      <div class="tips-section">
        <h3>Tips de Oro</h3>
        <div class="tip-banner">
          <div class="tip-icon"><ion-icon name="bulb-outline"></ion-icon></div>
          <div class="tip-content">
            <strong>Activa el Modo Oscuro</strong>
            <p>Ahorra batería y cuida tu vista usando el nuevo tema premium navy en Ajustes.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
