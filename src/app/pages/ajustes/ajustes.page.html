<div class="standard-dashboard">
  <!-- Custom Header -->
  <header class="custom-header">
    <div class="header-content">
      <ion-buttons slot="start">
        <ion-menu-button menu="main-menu" class="menu-btn">
          <ion-icon name="menu-outline"></ion-icon>
        </ion-menu-button>
      </ion-buttons>
      <h1 class="header-title">Configuración</h1>
      <div style="width: 44px;"></div> <!-- Spacer for symmetry -->
    </div>
  </header>

  <div class="dashboard-content-scroll">
    <div class="section-group">
      <h2 class="section-title-std">Preferencias</h2>
      
      <div class="premium-card-settings">
        <div class="setting-item" (click)="toggleTheme(); $event.stopPropagation()">
          <div class="setting-info">
            <div class="icon-circle color-theme">
              <ion-icon [name]="isDark() ? 'moon' : 'sunny'"></ion-icon>
            </div>
            <div class="texts">
              <span class="title">Modo Oscuro</span>
              <span class="subtitle">Cambia entre tema claro y oscuro</span>
            </div>
          </div>
          <div class="toggle-track" [class.active]="isDark()">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="setting-item" (click)="toggleNotifications()">
          <div class="setting-info">
            <div class="icon-circle color-notif">
              <ion-icon name="notifications-outline"></ion-icon>
            </div>
            <div class="texts">
              <span class="title">Notificaciones</span>
              <span class="subtitle">Recibe avisos de recolección</span>
            </div>
          </div>
          <div class="toggle-track" [class.active]="notificationsActive()">
            <div class="toggle-thumb"></div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="setting-item" (click)="toggleGpsAlways()">
          <div class="setting-info">
            <div class="icon-circle color-gps">
              <ion-icon name="navigate-outline"></ion-icon>
            </div>
            <div class="texts">
              <span class="title">GPS Siempre Activo</span>
              <span class="subtitle">Seguimiento en tiempo real</span>
            </div>
          </div>
          <div class="toggle-track" [class.active]="gpsAlwaysActive()">
            <div class="toggle-thumb"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-group" style="margin-top: 32px;">
      <h2 class="section-title-std">Acerca de</h2>
      
      <div class="premium-card-settings">
        <div class="info-row">
          <span class="label">Versión</span>
          <span class="value">1.0.0</span>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <span class="label">Soporte</span>
          <span class="value">soporte@str.com</span>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <span class="label">Desarrollado por</span>
          <span class="value font-bold">STR Team</span>
        </div>
      </div>
    </div>
  </div>
</div>
