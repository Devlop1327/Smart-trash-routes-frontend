<ion-app>
  <!-- Menú lateral (hamburguesa) -->
  <ion-menu contentId="main-content" menuId="main-menu" side="start" swipe-gesture="true" class="premium-menu">
    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-toolbar">
        <ion-title>S.T.R</ion-title>
      </ion-toolbar>
    </ion-header>
    
    <ion-content class="menu-content">
      <div class="menu-content-std">
       

        <div class="menu-separator"></div>

        <!-- Navegación Principal -->
        <nav class="menu-nav-links">
          <div class="nav-item" routerLink="/dashboard" routerDirection="root" routerLinkActive="active-item">
            <div class="icon-box">
              <ion-icon name="home-outline"></ion-icon>
            </div>
            <span class="nav-text">Panel Principal</span>
          </div>
          
          <div class="nav-item" routerLink="/mapa" routerDirection="root" routerLinkActive="active-item">
            <div class="icon-box">
              <ion-icon name="map-outline"></ion-icon>
            </div>
            <span class="nav-text">Mapa de Recolección</span>
          </div>
          
          <div class="nav-item" routerLink="/reportar" routerDirection="root" routerLinkActive="active-item">
            <div class="icon-box">
              <ion-icon name="alert-circle-outline"></ion-icon>
            </div>
            <span class="nav-text">Reportar Incidencia</span>
          </div>
          
          <div class="nav-item" routerLink="/ajustes" routerDirection="root" routerLinkActive="active-item">
            <div class="icon-box">
              <ion-icon name="settings-outline"></ion-icon>
            </div>
            <span class="nav-text">Configuración</span>
          </div>

          <div class="nav-item" routerLink="/ayuda" routerDirection="root" routerLinkActive="active-item">
            <div class="icon-box">
              <ion-icon name="help-circle-outline"></ion-icon>
            </div>
            <span class="nav-text">Ayuda y Tips</span>
          </div>

          <div class="nav-item" routerLink="/acerca-de" routerDirection="root" routerLinkActive="active-item">
            <div class="icon-box">
              <ion-icon name="information-circle-outline"></ion-icon>
            </div>
            <span class="nav-text">Acerca de</span>
          </div>
        </nav>

        <div class="spacer"></div>
        
        <!-- Tema y Pie de Menú -->
        <div class="menu-footer-std">
          <div class="theme-card-std" (click)="themeService.toggleTheme()">
            <div class="theme-info">
              <ion-icon [name]="themeService.isDark() ? 'moon' : 'sunny'" class="theme-icon"></ion-icon>
              <div class="theme-texts">
                <span class="theme-status">{{ themeService.isDark() ? 'Modo Oscuro' : 'Modo Claro' }}</span>
              </div>
            </div>
            <div class="toggle-track" [class.active]="themeService.isDark()">
              <div class="toggle-thumb"></div>
            </div>
          </div>
          
          <div class="version-tag">v1.0.0 STR</div>
        </div>
      </div>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
