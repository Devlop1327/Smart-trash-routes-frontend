</button>

<!-- Search Bar -->
<div class="bg-surface-container-lowest shadow-lg shadow-on-surface/5 rounded-xl px-4 py-3 flex items-center gap-3">
<span class="material-symbols-outlined text-outline">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-medium placeholder:text-outline-variant" placeholder="Buscar dirección o zona..." type="text"/>

<button class="flex items-center gap-2 bg-primary-container text-on-primary-container px-4 py-2 rounded-full whitespace-nowrap shadow-sm">

<span class="font-label text-xs font-semibold uppercase tracking-wider">Orgánicos</span>
</button>
<button class="flex items-center gap-2 bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full whitespace-nowrap shadow-sm">
<span class="material-symbols-outlined text-sm">water_drop</span>
<span class="font-label text-xs font-semibold uppercase tracking-wider">Plásticos</span>
</button>
<button class="flex items-center gap-2 bg-surface-container-highest text-on-surface-variant px-4 py-2 rounded-full whitespace-nowrap shadow-sm">
<span class="material-symbols-outlined text-sm">delete</span>
<span class="font-label text-xs font-semibold uppercase tracking-wider">General</span>
</button>
</div>
</div>

<span class="material-symbols-outlined">add</span>
</button>
<button class="w-12 h-12 bg-surface-container-lowest rounded-xl shadow-lg flex items-center justify-center text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="w-12 h-12 bg-surface-container-lowest rounded-xl shadow-lg flex items-center justify-center text-secondary active:scale-95 transition-transform mt-4">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">near_me</span>
</button>
</div>
<!-- Selected Route Details Card -->
<div class="absolute bottom-24 left-4 right-4 z-20">
<div class="bg-surface-container-lowest rounded-[2rem] p-6 shadow-2xl shadow-on-surface/10 border border-outline-variant/15">

<div>
<div class="flex items-center gap-2 mb-1">

</div>
<h2 class="font-headline text-2xl font-extrabold text-on-surface tracking-tight">Ruta Centro Histórico</h2>
</div>
<button class="bg-surface-container-low p-2 rounded-full text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="grid grid-cols-2 gap-3 mb-6">
<div class="bg-surface-container-low rounded-2xl p-3">
<span class="font-label text-[10px] font-semibold text-outline uppercase block mb-1">Frecuencia</span>
<p class="font-body text-sm font-bold text-on-surface">Lunes y Jueves</p>
</div>
<div class="bg-surface-container-low rounded-2xl p-3">
<span class="font-label text-[10px] font-semibold text-outline uppercase block mb-1">Próxima recolección</span>
<p class="font-body text-sm font-bold text-primary">Hoy, 14:30</p>

</div>
<div class="flex items-center justify-between">

</div>
</div>
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary px-6 py-3 rounded-xl font-bold text-sm shadow-md active:translate-y-1 transition-all">

</div>

<span class="material-symbols-outlined">home</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-teal-100/50 dark:bg-teal-900/40 text-teal-900 dark:text-teal-100 rounded-2xl px-5 py-2 active:translate-y-1 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">map</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Routes</span>

<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Schedule</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-2 hover:text-teal-600 dark:hover:text-teal-300 active:translate-y-1 transition-all">
<span class="material-symbols-outlined">notifications</span>
<span class="font-inter text-[11px] font-semibold uppercase tracking-wider mt-1">Alerts</span>

<div class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 px-5 py-2 hover:text-teal-600 dark:hover:text-teal-300 active:translate-y-1 transition-all">
